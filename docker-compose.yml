name: recon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recon}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recon} -d ${POSTGRES_DB:-recon}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Self-hosted sentence-transformers. An external embedding API would be
  # faster to wire up but would break "comes up on a laptop with no network
  # config" -- and would make retrieval quality depend on a vendor's model
  # version, which replay cannot pin.
  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    environment:
      ENABLE_CUDA: "0"
    healthcheck:
      # The image ships neither wget nor curl, but it is a Python service.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/.well-known/ready')"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.2
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: text2vec-transformers
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
      QUERY_DEFAULTS_LIMIT: 25
    depends_on:
      t2v-transformers:
        condition: service_healthy
    ports:
      - "58080:8080"
      - "50051:50051"
    volumes:
      - weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://recon:recon@postgres:5432/recon}
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      RECON_TENANT: ${RECON_TENANT:-harborview}
      RECON_SEED: ${RECON_SEED:-20260601}
      RECON_DATA_DIR: /data
      RECON_EVALS_DIR: /evals
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app/src
      - ./api/tests:/app/tests
      - ./api/migrations:/app/migrations
      - ./data:/data
      - ./evals:/evals
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
  weaviatedata:
